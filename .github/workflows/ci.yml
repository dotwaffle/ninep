name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Caching note: setup-go's built-in cache uses one key per
# (os, arch, go-version, go.sum) with no job component, so every job
# below would collide on a single entry and only the first writer's
# build cache survives. Instead each job disables that cache and splits
# the two directories:
#   - ~/go/pkg/mod  (module source, arch-independent) shares one key, so
#     the first writer wins on byte-identical content -- harmless.
#   - ~/.cache/go-build (compiled artifacts, keyed by build flags AND
#     arch) gets a per-job, per-arch key so the -race, fuzz, stress, and
#     lint build sets each persist instead of evicting one another.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-test-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-test-

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Compile integration tests
        run: go test -tags integration -run ^$ ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      # golangci-lint-action@v9 caches only ~/.cache/golangci-lint (its
      # analysis cache); since v5.0.0 it defers the Go build/module cache
      # to setup-go, so this block owns ~/.cache/go-build for the lint run.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-lint-

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: p9l-codec
            target: FuzzCodecRoundTrip
            pkg: ./proto/p9l/
          - name: p9u-codec
            target: FuzzCodecRoundTrip
            pkg: ./proto/p9u/
          - name: dirent-codec
            target: FuzzDirentRoundTrip
            pkg: ./proto/
          - name: client-lock
            target: FuzzClientLock
            pkg: ./client/
          - name: client-xattr
            target: FuzzClientXattr
            pkg: ./client/
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      # Per-matrix-leg key: the four legs run in parallel and build
      # different packages, so a shared key would re-introduce
      # first-writer-wins among them.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-fuzz-${{ matrix.name }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-fuzz-${{ matrix.name }}-

      - name: Fuzz ${{ matrix.name }}
        run: go test -fuzz=${{ matrix.target }} -fuzztime=60s -run='^$' ${{ matrix.pkg }}

      # On a fuzz failure, go test writes the minimized crasher to
      # <pkg>/testdata/fuzz/<Target>/<hash> on the runner. Capture it so it
      # can be downloaded and committed as a permanent regression seed.
      - name: Upload fuzz crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ matrix.name }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30

  stress:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-stress-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-stress-

      - name: Stress tests (requestCtx race surface)
        run: go test -tags=stress -race -count=1 ./server/...

  vsock:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-vsock-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-vsock-

      - name: Load vsock loopback module
        run: sudo modprobe vsock_loopback

      - name: Fix /dev/vsock permissions
        run: sudo chmod 666 /dev/vsock

      - name: Vsock loopback tests (must not skip)
        run: |
          set -eo pipefail
          go test -race -count=1 -v ./vsock/... | tee vsock.out
          if grep -q -- '--- SKIP' vsock.out; then
            echo "::error::vsock loopback tests skipped; loopback transport not active on runner"
            exit 1
          fi

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-benchmark-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-benchmark-

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: go test -v -bench=BenchmarkClient -run=^$ ./client/ | tee benchmarks.txt

      - name: Process benchmarks
        run: benchstat benchmarks.txt

  cross-build:
    # Compile+vet only (no test execution) on GOOS/GOARCH combinations the
    # test/lint/fuzz/stress/vsock jobs never touch, since those all run on
    # ubuntu amd64/arm64. This exists because of a real incident: an
    # unconvert --fix in server/passthrough broke the linux/arm, linux/386,
    # and linux/arm64 cross-builds while staying invisible to amd64-only CI
    # (see .golangci.yml). Most of these GOOS targets can't run tests on a
    # Linux runner anyway, so this only proves the tree still builds and
    # vets there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: riscv64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: arm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-gomod-

      # Per-target key: the six legs run in parallel and cross-compile
      # different GOOS/GOARCH pairs, so a shared key would re-introduce
      # first-writer-wins among them.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-gobuild-cross-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-gobuild-cross-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
